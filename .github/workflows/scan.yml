name: POI zone scanner
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a Telegram test message'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scan the indices
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event.inputs.test }}
        run: python scanner.py
      - name: Remember which alerts were sent
        run: |
          git config user.name "poi-scanner"
          git config user.email "poi-scanner@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || git commit -m "Update sent alerts"
          git push || true
